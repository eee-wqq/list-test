<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>To-Do List</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      margin-top: 50px;
    }

    .app {
      background: #fff;
      padding: 20px;
      width: 300px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 15px;
    }

    input {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 8px;
      margin-top: 8px;
      background: #007bff;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background: #0056b3;
    }

    ul {
      list-style: none;
      padding: 0;
      margin-top: 15px;
    }

    li {
      padding: 8px;
      background: #eee;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      cursor: pointer;
    }

    li.completado {
      text-decoration: line-through;
      color: gray;
    }
  </style>
</head>

<body>

  <div class="app">
    <h1>Mis tareas</h1>

    <input type="text" id="tarea" placeholder="Escribe una tarea">
    <button onclick="agregarTarea()">Agregar</button>

    <ul id="lista"></ul>
  </div>

  <script>

      }
